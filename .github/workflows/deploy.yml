name: Build and Deploy NotionLite

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for AWS OIDC login
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint code
        run: npm run lint

      - name: Run unit & integration tests
        run: npm run test

      - name: Test production build
        run: npm run build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: notionlite
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy to EC2 via AWS Systems Manager (SSM)
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NotionLite commit ${{ github.sha }}" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${AWS_REGION:-ap-south-1} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/notionlite:latest\",
              \"docker stop notionlite || true\",
              \"docker rm notionlite || true\",
              \"/opt/notionlite/run.sh $REGISTRY/notionlite:latest\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched: $COMMAND_ID"

          # Wait for command execution
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Verify Health Endpoint
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          echo "Verifying health endpoint at http://$APP_HOST/api/health..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$APP_HOST/api/health")
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check succeeded (HTTP $STATUS)!"
